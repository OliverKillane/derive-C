[project]
name = "derive-py"
requires-python = ">=3.14"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "pytest>=9.1.1",
    "mypy>=2.2.0",
    "ruff>=0.15.21",
    "polars>=1.42.1",
    "pyarrow>=25.0.0",
    "plotly[express]>=6.9.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "nbqa>=1.9.1"
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[project.scripts]
linting = "src.linting.main:main"
intellisense = "src.intellisense.main:main"
bench = "src.benchmarks.cli:main"

[tool.mypy]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
exclude = ["^build/"]